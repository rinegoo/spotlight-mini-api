# Ручная часть списка ограничений — ФОРМАТ. Имена ниже вымышленные.
#
# Настоящий список заведения хранится ТОЛЬКО в <DATA_DIR>/restrictions/manual.yaml
# и НЕ добавляется в репозиторий: упоминание иноагентов без указания статуса —
# нарушение (ч. 2.1 ст. 13.15 КоАП), а экстремистские материалы распространять нельзя.
#
# Автоматическая часть — официальные реестры, API обновляет их сам.
# Отчёт «что применяется / что проверить»: restrictions-ru-inoagents -data <DATA_DIR> -catalog base.db
#
# subject — как в реестре (псевдонимы и скобки можно опустить): даты включения и
# исключения берутся из реестра, поэтому при исключении пометка снимается сама.

# labels:                       # переопределить форму указания (по умолчанию — по постановлению № 2108)
#   ru.inoagent: "… {name} …"

add:
  # В реестре только ФИО, в каталоге — сценическое имя.
  - subject: Фамилия Имя Отчество
    artists: [СЦЕНИЧЕСКОЕ ИМЯ]

  # Группа, участник которой в реестре (решение: помечать).
  - subject: Фамилия Имя Отчество участника
    artists: [НАЗВАНИЕ ГРУППЫ]
    note: в реестре — участник группы

  # Совпадение по ФИО, проверенное вручную (не однофамилец).
  - subject: Фамилия Имя Отчество
    artists: [ФАМИЛИЯ ИМЯ]

  # Правило без записи в реестре (запрет суда):
  # - kind: ru.court_ban
  #   subject: Решение … районного суда от …
  #   since: 2025-06-01
  #   songs: [{artist: "…", title: "…"}]

ignore:
  # Организация из реестра, совпавшая с названием исполнителя.
  - subject: Название организации из реестра
    artists: [ОДНОИМЁННЫЙ ИСПОЛНИТЕЛЬ]
    note: исполнитель — не эта организация
  # Ложное совпадение по списку экстремистских материалов (решение юриста).
  # - subject: федеральный список экстремистских материалов, № …
  #   artists: [ИСПОЛНИТЕЛЬ]
